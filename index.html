<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Omo Trainer v0.10</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
  <!-- ЭКРАН 1: СОЗДАНИЕ ПРОФИЛЯ -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <div class="lang-selector">
        <label for="langSelectProfile">Language / Язык</label>
        <select id="langSelectProfile"></select>
      </div>
      <div class="theme-row">
        <label id="themeToggleLabel" for="themeToggleBtn">Theme</label>
        <button id="themeToggleBtn">Toggle Dark/Light</button>
      </div>
      <h1 id="profileTitle">Omo Trainer</h1>
      <label id="nameLabel" for="profileName">Your name</label>
      <input type="text" id="profileName" placeholder="e.g., Alex" autocomplete="off">
      <label id="maxVolumeLabel" for="profileMaxVolume">Maximum bladder volume (ml, goal)</label>
      <input type="number" id="profileMaxVolume" value="500" min="100" max="5000" step="10">
      <button id="saveProfileBtn">Create / Start</button>
      <div id="profileNote" class="note">You can drink above the limit – no restrictions.</div>
    </div>
  </div>

  <!-- ЭКРАН 2: ОСНОВНОЙ ТРЕКЕР -->
  <div id="mainScreen" class="screen">
    <div class="card">
      <div class="lang-selector">
        <label for="langSelectMain">Language / Язык</label>
        <select id="langSelectMain"></select>
      </div>
      <div class="theme-row">
        <label id="themeToggleLabelMain" for="themeToggleBtnMain">Theme</label>
        <button id="themeToggleBtnMain">Toggle Dark/Light</button>
      </div>
      <div class="user-name" id="greetingName">player</div>
      <h2 id="bladderTitle">Bladder</h2>
      <div class="volume-digits">
        <span id="volumeMain">0 mL / 500 mL</span>
      </div>
      <div class="progress-wrapper">
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="status-text" id="statusMsg">
        Can't estimate time to potty emergency. Drink more :)
      </div>

      <div class="slider-container">
        <div class="slider-label">
          <span id="drinkLabel">Drink at once</span>
          <strong><span id="drinkAmountValue">100</span> ml</strong>
        </div>
        <input type="range" id="drinkSlider" min="10" max="1000" value="100" step="1">
      </div>

      <button id="drinkButton">DRINK</button>

      <div class="action-grid">
        <button id="askPermissionBtn">ASK FOR PERMISSION</button>
        <button id="peeButton">PEE</button>
        <button id="cantHoldBtn">I CAN'T HOLD IT!</button>
        <button id="leakingBtn">LEAKING</button>
      </div>

      <div class="double-buttons">
        <button id="resetProgressBtn">RESET</button>
        <button id="editProfileBtn">EDIT PROFILE</button>
      </div>

      <div class="version">
        0.10
      </div>
    </div>
  </div>
</div>

<script src="locales.js"></script>
<script src="scripts.js"></script>
</body>
</html>
