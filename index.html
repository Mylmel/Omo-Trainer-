<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Omo Trainer v0.53</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
  <!-- ЭКРАН 1: ПРОФИЛЬ -->
  <div id="profileScreen" class="screen">
    <div class="card">
      <h1 id="profileTitle">Omo Trainer</h1>
      <label id="nameLabel" for="profileName">Your name</label>
      <input type="text" id="profileName" placeholder="e.g., Alex" autocomplete="off">
      <label id="maxVolumeLabel" for="profileMaxVolume">Maximum bladder volume (ml, goal)</label>
      <input type="number" id="profileMaxVolume" value="500" min="100" max="5000" step="10">
      <button id="saveProfileBtn">Create / Start</button>
      <!-- Кнопка отмены (изначально скрыта) -->
      <button id="cancelProfileBtn" style="display: none;">CANCEL</button>
      <div id="profileNote" class="note">You can drink above the limit – no restrictions.</div>
    </div>
  </div>

  <!-- ЭКРАН 2: ОСНОВНОЙ -->
  <div id="mainScreen" class="screen">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
        <div class="user-name" id="greetingName">player</div>
        <div class="version-top">v0.53</div>
      </div>
      <h2 id="bladderTitle">Bladder</h2>
      <div class="volume-digits">
        <span id="volumeMain">0 mL / 500 mL</span>
      </div>
      <div class="progress-wrapper">
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="status-text" id="statusMsg">All calm. Drink more.</div>

      <div class="slider-container">
        <div class="slider-label">
          <span id="drinkLabel">Drink at once</span>
          <strong><span id="drinkAmountValue">100</span> ml</strong>
        </div>
        <input type="range" id="drinkSlider" min="10" max="1000" value="100" step="10">
        <div class="drink-type-selector">
          <label id="drinkTypeLabel" for="drinkTypeSelect">Drink type</label>
          <select id="drinkTypeSelect"></select>
        </div>
      </div>

      <button id="drinkButton">DRINK</button>

      <div class="action-grid">
        <button id="askPermissionBtn">ASK FOR PERMISSION</button>
        <button id="peeButton">PEE</button>
        <button id="cantHoldBtn">I CAN'T HOLD IT!</button>
        <button id="leakingBtn">LEAKING</button>
        <button id="breathingBtn">DEEP BREATHING</button>
      </div>

      <div class="double-buttons">
        <button id="resetProgressBtn">RESET</button>
        <button id="settingsBtn">SETTINGS</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 3: ОБЩИЕ НАСТРОЙКИ -->
  <div id="settingsScreen" class="screen">
    <div class="card">
      <h2 id="settingsTitle">Settings</h2>
      <div class="settings-row">
        <label id="settingsLangLabel" for="settingsLangSelect">Language</label>
        <select id="settingsLangSelect"></select>
      </div>
      <div class="settings-row">
        <label id="settingsThemeLabel" for="settingsThemeSelect">Theme</label>
        <select id="settingsThemeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="settings-row realism-row">
        <label id="realismLabel" for="realismToggle">Realism mode</label>
        <label class="switch">
          <input type="checkbox" id="realismToggle">
          <span class="slider-round"></span>
        </label>
        <button id="openRealismSettingsBtn" class="realism-settings-btn">REALISM SETTINGS</button>
        <div class="settings-note" id="realismNote">Only 50-70% of liquid reaches the bladder</div>
      </div>
      <div class="settings-row">
        <label id="settingsIntervalLabel" for="settingsIntervalInput">Fill interval (ms per 1 ml)</label>
        <input type="number" id="settingsIntervalInput" min="100" max="60000" step="100" value="3800">
        <div class="settings-note" id="settingsIntervalNote">Lower value = faster filling</div>
      </div>
      <div class="double-buttons">
        <button id="editProfileFromSettingsBtn">EDIT PROFILE</button>
        <button id="closeSettingsBtn" class="settings-close-btn">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 4: РАСШИРЕННЫЕ НАСТРОЙКИ РЕАЛИЗМА -->
  <div id="realismSettingsScreen" class="screen">
    <div class="card realism-settings-card">
      <h2 id="realismSettingsTitle">Realism Settings</h2>

      <div class="settings-category">
        <h3 id="externalConditionsTitle">External conditions</h3>
        <div class="settings-row">
          <label id="temperatureLabel" for="temperatureSelect">Temperature</label>
          <select id="temperatureSelect"></select>
        </div>
        <div class="settings-row checkbox-row">
          <label id="waterSoundsLabel" for="waterSoundsToggle">Water sounds effect</label>
          <input type="checkbox" id="waterSoundsToggle">
        </div>
        <div class="settings-row checkbox-row">
          <label id="lockedDoorLabel" for="lockedDoorToggle">Locked door factor</label>
          <input type="checkbox" id="lockedDoorToggle">
        </div>
      </div>

      <div class="settings-category">
        <h3 id="medicalTitle">Medical</h3>
        <div class="settings-row">
          <label id="ageLabel" for="ageSelect">Age</label>
          <select id="ageSelect"></select>
        </div>
        <div class="settings-row checkbox-row">
          <label id="prostateLabel" for="prostateToggle">Prostatitis / BPH</label>
          <input type="checkbox" id="prostateToggle">
        </div>
        <div class="settings-row checkbox-row">
          <label id="cystitisLabel" for="cystitisToggle">Cystitis</label>
          <input type="checkbox" id="cystitisToggle">
        </div>
        <div class="settings-row checkbox-row">
          <label id="pregnancyLabel" for="pregnancyToggle">Pregnancy</label>
          <input type="checkbox" id="pregnancyToggle">
        </div>
        <div class="settings-row checkbox-row">
          <label id="menstrualLabel" for="menstrualToggle">Menstrual cycle</label>
          <input type="checkbox" id="menstrualToggle">
        </div>
      </div>

      <div class="double-buttons realism-buttons">
        <button id="saveRealismSettingsBtn">SAVE AND CLOSE</button>
        <button id="cancelRealismSettingsBtn">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<script src="locales.js"></script>
<script src="trainer.js"></script>
<script src="realism.js"></script>
<script src="scripts.js"></script>
</body>
</html>
